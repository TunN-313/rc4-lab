    <script>
      // Polyfill safeguard: Ensure window.fetch has both getter and setter
      // Prevents "Cannot set property fetch of #<Window> which has only a getter"
      try {
        if (typeof window !== 'undefined' && typeof window.fetch === 'function') {
          let _currentFetch = window.fetch.bind(window);
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return _currentFetch;
            },
            set: function (newFn) {
              _currentFetch = newFn;
            },
            configurable: true,
            enumerable: true,
          });
        }
      } catch (e) {
        console.warn('Fetch setter safeguard error:', e);
      }
    </script>
